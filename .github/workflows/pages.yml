name: Test and publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: JavaScript tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm test
      - run: npm run test:helpers

  browser:
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Match package-lock.json. Browsers and OS dependencies are preinstalled,
    # so Ubuntu mirror DNS failures cannot block the test environment setup.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble@sha256:dcc5531e97840b9b5e794f2814476b21571c5124a3fca2267d73041f56e7580e
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run test:browser
        env:
          WQV_BROWSER_ARTIFACTS: ${{ runner.temp }}/wqv-browser
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: browser-checks
          path: ${{ runner.temp }}/wqv-browser
          retention-days: 7

  deploy:
    name: GitHub Pages
    needs: [test, browser]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Include license notices
        run: |
          cp LICENSE dist/LICENSE.txt
          cp third-party-notices.txt dist/third-party-notices.txt
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
