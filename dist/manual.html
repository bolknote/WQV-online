<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="only light">
<title>Pocket Word · CASSIOPEIA</title><link rel="icon" href="./icons.svg"><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./programs.css"><link rel="stylesheet" href="./manual.css"><script type="module" src="./manual.mjs"></script>
</head><body>
<div class="desktop-caption"><span>CASIO WRIST CAMERA</span><span>PERSONAL DIGITAL COMPANION</span></div>
<main class="cassiopeia">
<header class="case-brand"><span class="casio">CASIO</span><span class="case-label">CASSIOPEIA</span><span class="case-model">WQV LINK / WEBUSB</span><span class="power-led on"></span></header>
<div class="screen">
<header class="titlebar"><button id="start-menu-button" class="start-button" aria-label="Open the application menu" aria-expanded="false" data-i18n-aria-label="Open the application menu" data-i18n="Start"><span class="start-flag" aria-hidden="true"><i></i><i></i><i></i><i></i></span>Start</button><span class="app-title"><svg class="icon" aria-hidden="true"><use href="./icons.svg#document"/></svg>Pocket Word</span><time id="pc-clock" title="Computer time" data-i18n-title="Computer time">--:--</time><a class="window-close" href="./" data-application-exit aria-label="Close document" title="Close document" data-i18n-aria-label="Close document" data-i18n-title="Close document">×</a></header>
<nav id="start-menu" class="start-menu" hidden aria-label="Application menu" data-i18n-aria-label="Application menu"><a href="./" data-application-exit data-i18n="Programs">Programs</a><hr><button id="start-options" data-i18n="Options…">Options…</button><button id="help-menu" data-i18n="About the manuals…">About the manuals…</button></nav>
<div class="menubar"><details class="menu"><summary data-i18n="File">File</summary><div class="menu-popup"><a id="original-pdf" target="_blank" rel="noopener" aria-disabled="true" data-i18n="Original PDF…">Original PDF…</a><hr><a href="./" data-application-exit data-i18n="Close document">Close document</a></div></details><details class="menu"><summary data-i18n="Tools">Tools</summary><div class="menu-popup"><button id="menu-options" data-i18n="Options…">Options…</button></div></details><button id="help-menu-bar" class="menu-text" data-i18n="Help">Help</button><span class="menubar-note" data-i18n="Read-only">Read-only</span></div>
<div class="document-heading"><svg class="icon" aria-hidden="true"><use href="./icons.svg#document"/></svg><strong id="document-title"></strong></div>
<div class="document-toolbar"><label><span data-i18n="Contents">Contents</span><select id="document-contents" aria-label="Contents" data-i18n-aria-label="Contents" disabled><option value="" data-i18n="Contents">Contents</option></select></label><label><span data-i18n="Text size">Text size</span><select id="document-size"><option value="small">14</option><option value="normal" selected>16</option><option value="large">18</option><option value="larger">20</option></select></label></div>
<div class="document-paper"><iframe id="document-frame" title="User’s Guide" data-i18n-title="User’s Guide"></iframe><p id="document-loading" data-i18n="Opening document…">Opening document…</p></div>
<footer class="document-status"><span id="document-status" aria-live="polite"></span><span data-i18n="Read-only">Read-only</span></footer>
</div>
<footer class="case-footer"><span class="speaker-grille" aria-hidden="true"></span><span>WQV LINK <b>2001</b></span><span class="case-caption">INFRARED · USB</span></footer>
</main>
<dialog id="message-dialog"><div class="dialog-title"><strong id="dialog-title">WQV Link</strong></div><div class="dialog-body"><p id="dialog-message"></p><div class="dialog-actions"><button id="dialog-cancel" data-i18n="Cancel">Cancel</button><button id="dialog-accept">OK</button></div></div></dialog>
<dialog id="options-dialog" class="options-dialog" aria-labelledby="options-title"><div class="dialog-title"><svg class="icon" aria-hidden="true"><use href="./icons.svg#settings"/></svg><strong id="options-title" data-i18n="Options">Options</strong></div><div class="dialog-body"><div class="settings-tabs"><span class="settings-tab" data-i18n="General">General</span></div><div class="settings-page"><fieldset><legend data-i18n="Display language">Display language</legend>
<label class="language-choice" translate="no" lang="en"><input type="radio" name="display-language" value="en" checked>English</label>
<label class="language-choice" translate="no" lang="ru"><input type="radio" name="display-language" value="ru">Русский</label>
<label class="language-choice" translate="no" lang="ja"><input type="radio" name="display-language" value="ja">日本語</label>
<p class="small-note" data-i18n="Choose the language used by WQV Link.">Choose the language used by WQV Link.</p></fieldset></div><div class="dialog-actions"><button id="options-accept">OK</button><button id="options-cancel" data-i18n="Cancel">Cancel</button></div></div></dialog>
</body></html>
